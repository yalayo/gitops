# Defaults; Terraform overrides image.repository / image.tag (and anything else it sets)
replicaCount: 1

image:
  repository: localhost:4566/000000000000/us-east-1/property-management
  tag: "c7de563" # jenkins-image-tag
  pullPolicy: Always

ports:
  http: 8080
  metrics: null   # set a port if the app exposes metrics separately
  extra: 9669

# The image's JVM flags are -Xms3g -Xmx4g -> needs ~4.5 GiB with non-heap memory
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

probes:
  startup:
    periodSeconds: 10
    failureThreshold: 30   # up to 30 × 10s = 5 min to start
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20
    failureThreshold: 3    # restart after ~1 min of not answering, once started

ingress:
  enabled: true
  className: nginx
  host: property-management.localhost

# Service account the pod runs as; ESO also uses its token (IRSA) to read Secrets Manager
serviceAccount:
  name: property-management
  roleArn: arn:aws:iam::000000000000:role/property-management-secrets

# Secrets come from AWS Secrets Manager via External Secrets Operator, synced into the
# <release>-db Secret and injected as env vars (DB_HOST, DB_PORT, DB_NAME, DB_USER,
# DB_PASSWORD, DATABASE_URL, plus anything in var.app_secrets)
secrets:
  enabled: true
  region: us-east-1
  awsSecretName: property-management/app
  version: "0.1.0"               # Secrets Manager version id; changes force a re-sync + pod restart
  refreshInterval: 1m