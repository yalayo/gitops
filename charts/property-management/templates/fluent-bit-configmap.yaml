{{- if .Values.logging.sidecar.enabled }}
{{- $sidecar := .Values.logging.sidecar }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    app: {{ .Release.Name }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    # JSON lines written by mulog's file publisher
    [INPUT]
        Name              tail
        Path              {{ $sidecar.logDir }}/*.log
        Tag               app.*
        Parser            json
        DB                {{ $sidecar.logDir }}/.fluent-bit-tail.db
        Read_from_Head    On
        Refresh_Interval  5
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

    [OUTPUT]
        Name          loki
        Match         *
        Host          ${LOKI_HOST}
        Port          ${LOKI_PORT}
        # keep labels low-cardinality; event fields stay searchable in the JSON line
        Labels        job=fluent-bit, app=${APP_NAME}, namespace=${POD_NAMESPACE}, pod=${POD_NAME}
        Line_Format   json
        Retry_Limit   5

  parsers.conf: |
    [PARSER]
        Name    json
        Format  json
{{- end }}
