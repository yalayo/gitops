{{- if .Values.secrets.enabled }}
# Syncs every key of the Secrets Manager JSON secret into the k8s Secret <release>-db
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    app: {{ .Release.Name }}
  annotations:
    # changes whenever Terraform writes a new secret version -> ESO re-syncs immediately
    force-sync: {{ .Values.secrets.version | quote }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Release.Name }}-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secrets.awsSecretName is required" .Values.secrets.awsSecretName | quote }}
{{- end }}