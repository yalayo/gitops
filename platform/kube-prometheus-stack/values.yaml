# kube-prometheus-stack (chart prometheus-community/kube-prometheus-stack) for the local Floci cluster:
# Prometheus + Grafana (+ kube-state-metrics, node-exporter). Grafana also queries Loki.

grafana:
  adminUser: admin
  adminPassword: admin           # local only - use admin.existingSecret on a real cluster
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.localhost        # http://grafana.localhost:8080
  persistence:
    enabled: false               # no default StorageClass; dashboards come from the chart/ConfigMaps
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
  grafana.ini:
    plugins:
      preinstall_disabled: true      # don't download extra app plugins on every start
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120         # time for the first start (migrations + dashboards)
    timeoutSeconds: 30
    failureThreshold: 10
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi                  # was 256Mi, too tight for Grafana 12

prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors/PodMonitors/rules from every namespace, not only ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
    # storageSpec omitted -> emptyDir (no default StorageClass in the Floci cluster)

# Saves ~100 MiB; enable and configure receivers when you want notifications
alertmanager:
  enabled: false

# k3s runs these inside the k3s server process, not as pods -> their scrape targets would be "down"
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

nodeExporter:
  enabled: false