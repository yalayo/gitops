# Grafana Loki (chart grafana/loki) in single-binary mode for a small local cluster.
# Receives logs from the Fluent Bit sidecars at loki.monitoring.svc.cluster.local:3100.
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single tenant, no X-Scope-OrgID needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h        # local: keep 3 days
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  # The Floci cluster has no default StorageClass (like stock EKS), so no PVC: data lives in an
  # emptyDir and is lost when the Loki pod restarts. See README for enabling persistence.
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Not needed in single-binary mode
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
